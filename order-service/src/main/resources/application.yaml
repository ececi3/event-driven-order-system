spring:
  application:
    name: order-service
  datasource:
    # Nota: usiamo 'order_db' (il nome del container) e non 'localhost'
    # perché il servizio gira all'interno della rete Docker
    url: jdbc:postgresql://order_db:5432/orders
    username: springuser
    password: springpassword
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect